{% extends "base.html" %}
{% block title %}Edit User - AndGames{% endblock %}
{% block header_title %}Edit User{% endblock %}
{% block header_right %}
  <a href="{{ url_for('admin') }}" style="color:#fff;font-size:13px">← Dashboard</a>
{% endblock %}

{% block content %}
<div class="card">
  <form method="post">
    <input name="username" value="{{ u.username }}" placeholder="Username" required>
    <input name="email" type="email" value="{{ u.email }}" placeholder="Email" required>
    <input name="no_hp" value="{{ u.no_hp }}" placeholder="No HP" required>

    <select name="metode" id="metode" required>
      <option value="ewallet" {{ 'selected' if u.metode == 'ewallet' }}>E-Wallet</option>
      <option value="bank" {{ 'selected' if u.metode == 'bank' }}>Bank</option>
    </select>

    <select name="provider" id="provider" required></select>

    <input name="norek" value="{{ u.norek }}" placeholder="No Rekening / No E-Wallet" required>
    <input name="password" type="password" placeholder="Password baru (kosongkan jika tidak diganti)">
    <button>Simpan</button>
  </form>
</div>

<script>
const P = {{ providers|tojson }};
const m = document.getElementById("metode");
const p = document.getElementById("provider");

function fill(sel) {
  p.innerHTML = "";
  (P[m.value] || []).forEach(x => {
    const o = document.createElement("option");
    o.value = o.textContent = x;
    if (x === sel) o.selected = true;
    p.appendChild(o);
  });
}
fill({{ (u.provider or '')|tojson }});
m.addEventListener("change", () => fill(""));
</script>
{% endblock %}
