<style>
  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
    display:flex;background:rgba(10,10,21,.92);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);z-index:100;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 20px rgba(0,0,0,.3);
  }
  .bottomnav a{
    flex:1;text-align:center;color:var(--muted);text-decoration:none;
    font-size:10px;font-weight:600;padding:4px 0;
    transition:.2s;position:relative;
  }
  .bottomnav a .nav-ico{
    display:block;width:22px;height:22px;margin:0 auto 3px;
    fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;transition:.2s;
  }
  .bottomnav a.active{color:var(--primary-2)}
  .bottomnav a.active .nav-ico{
    stroke:url(#nav-grad);
    filter:drop-shadow(0 0 6px rgba(168,85,247,.6));
  }
  .bottomnav a:hover{color:var(--text)}
  .bottomnav a.active::before{
    content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);
    width:24px;height:3px;background:var(--grad-1);border-radius:0 0 4px 4px;
  }

  /* tombol Game tengah — menonjol */
  .bottomnav a.nav-center{
    position:relative;
    margin-top:-22px;
  }
  .bottomnav a.nav-center .center-ico{
    width:50px;height:50px;border-radius:16px;
    background:var(--grad-1);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 3px;
    box-shadow:0 8px 22px rgba(139,92,246,.5);
    border:3px solid var(--bg);
    transition:.2s;
  }
  .bottomnav a.nav-center .center-ico svg{
    width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .bottomnav a.nav-center:hover .center-ico{
    transform:translateY(-2px) scale(1.05);
    box-shadow:0 10px 28px rgba(139,92,246,.65);
  }
  .bottomnav a.nav-center.active .center-ico{
    box-shadow:0 0 0 3px rgba(168,85,247,.35),
               0 8px 22px rgba(139,92,246,.6);
  }
  .bottomnav a.nav-center span{
    display:block;font-size:10px;font-weight:700;
    color:var(--muted);transition:.2s;
  }
  .bottomnav a.nav-center.active span{color:var(--primary-2)}
  .bottomnav a.nav-center::before{display:none}
</style>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="nav-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
</svg>
