<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>{% block title %}AndGames{% endblock %}</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --primary:#2563eb; --primary-dark:#1d4ed8;
    --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --green:#16a34a; --red:#dc2626; --amber:#f59e0b;
  }
  *{box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    max-width:480px;margin:0 auto;padding:0 0 90px;
    background:var(--bg);color:var(--text);min-height:100vh;
  }
  .app-header{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;padding:14px 16px;display:flex;justify-content:space-between;
    align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .app-header h1{font-size:16px;margin:0;font-weight:600}
  .app-header .saldo{font-size:13px;opacity:.9}
  .app-body{padding:14px}
  .card{
    background:var(--card);border-radius:14px;padding:14px;
    margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  h2{font-size:18px;margin:0 0 10px}
  h3{font-size:15px;margin:14px 0 8px}
  input,select,button,textarea{
    width:100%;padding:11px;margin:6px 0;box-sizing:border-box;
    border:1px solid var(--border);border-radius:10px;font-size:14px;
    background:#fff;color:var(--text);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);border-color:transparent}
  button{
    background:var(--primary);color:#fff;border:0;border-radius:10px;
    font-weight:600;cursor:pointer;transition:.15s;
  }
  button:hover{background:var(--primary-dark)}
  button.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  button.danger{background:var(--red)}
  button.success{background:var(--green)}
  button.small{width:auto;padding:5px 10px;font-size:12px;margin:0}
  .flash{
    background:#fef3c7;color:#78350f;padding:10px 14px;border-radius:10px;
    margin:10px 14px;font-size:13px;border-left:4px solid var(--amber);
  }
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{border-bottom:1px solid var(--border);padding:8px 6px;text-align:left}
  th{background:#f8fafc;font-weight:600;color:var(--muted);font-size:12px}
  .wrap{overflow-x:auto;border-radius:10px;background:#fff}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  .muted{color:var(--muted);font-size:12px}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .badge.pending{background:#fef3c7;color:#92400e}
  .badge.approved{background:#dcfce7;color:#166534}
  .badge.rejected{background:#fee2e2;color:#991b1b}
  .empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:13px}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  .big-saldo{font-size:26px;font-weight:700;margin:4px 0}
  .mini-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .mini-nav a{
    padding:6px 12px;border-radius:20px;background:#fff;font-size:13px;
    border:1px solid var(--border);
  }
  .mini-nav a.active{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
{% block head %}{% endblock %}
</head>
<body>

{% block header %}
<div class="app-header">
  <h1>{% block header_title %}AndGames{% endblock %}</h1>
  {% block header_right %}{% endblock %}
</div>
{% endblock %}

{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}

<div class="app-body">
{% block content %}{% endblock %}
</div>

{% block bottomnav %}{% endblock %}

</body>
</html>
